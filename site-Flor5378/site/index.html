<script>
  // Applied before first paint to avoid a theme flash.
  try {
    var t = localStorage.getItem('fg-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

      <div class="rail__controls">

        </div>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Basculer le thème">
